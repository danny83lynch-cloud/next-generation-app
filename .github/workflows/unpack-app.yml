name: Unpack app
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack app files
        run: |
          if [ -f NEXT_GENERATION_GITHUB_UPLOAD.zip ]; then
            unzip -o NEXT_GENERATION_GITHUB_UPLOAD.zip -d .
            rm -f NEXT_GENERATION_GITHUB_UPLOAD.zip
          fi
      - name: Commit unpacked app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Unpack NEXT GENERATION app"
          git push
