name: Unpack app
on:
  push:
    paths:
      - 'NEXT_GENERATION_GITHUB_UPLOAD.zip'
      - '.github/workflows/unpack-app.yml'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack app files
        run: |
          unzip -o NEXT_GENERATION_GITHUB_UPLOAD.zip -d .
          rm -f NEXT_GENERATION_GITHUB_UPLOAD.zip
      - name: Commit unpacked app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Unpack NEXT GENERATION app"
          git push
